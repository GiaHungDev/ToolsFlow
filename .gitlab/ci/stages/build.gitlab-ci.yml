Build:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - !reference [.push-or-merge-to-protected, rules]
  before_script:
    - docker version
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Building image for version $CI_COMMIT_SHA on $CI_COMMIT_BRANCH..."
    - docker pull $CI_REGISTRY_IMAGE:nightly || true
    - cp .env.development .env.production
    - docker build --cache-from $CI_REGISTRY_IMAGE --tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA -f docker/Dockerfile .
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE:nightly
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE:nightly

Build Production:
  stage: build
  rules:
    - !reference [.only-tag, rules]
  when: manual
  environment:
    name: production
    url: $K8S_PROD_PROJECT_URL
  before_script:
    - TAG_NAME=$(cat VERSION)
    - docker version
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Building image for version $TAG_NAME on $CI_COMMIT_BRANCH..."
    - docker pull $CI_REGISTRY_IMAGE:latest
    - docker build --cache-from $CI_REGISTRY_IMAGE --tag $CI_REGISTRY_IMAGE:$TAG_NAME -f docker/Dockerfile .
    - docker tag $CI_REGISTRY_IMAGE:$TAG_NAME $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:$TAG_NAME
    - docker push $CI_REGISTRY_IMAGE:latest
